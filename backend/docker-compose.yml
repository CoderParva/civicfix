services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicfix}
      POSTGRES_USER: ${POSTGRES_USER:-civicfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicfix}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicfix} -d ${POSTGRES_DB:-civicfix}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      args:
        REQUIREMENTS: dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      # "local" runs the real AI models when installed (scripts/install-ai-libs.sh); "disabled" behaves like production.
      AI_INFERENCE: ${AI_INFERENCE:-local}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
